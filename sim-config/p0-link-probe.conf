# ===========================================================================
# P0 — link-probe overlay. Load AFTER fanet-tier2.conf:
#
#   --config=sim-config/fanet-tier2.conf --config=sim-config/p0-link-probe.conf
#
# This file holds only what the P0 instrumentation scenario deviates from the
# nominal FANET config. The channel model itself (exponent, Nakagami m and
# distance tiers) is deliberately NOT repeated here: the sigma table in the
# paper must be measured on the same channel the dataset is collected on, and
# a duplicated physics block is a block that drifts.
#
# NOTHING HERE BELONGS IN THE PAPER'S SIMULATION SETUP TABLE. link-probe is a
# 2-node calibration flight, not a FANET scenario.
# ---------------------------------------------------------------------------


# --- Detection floor -------------------------------------------------------
# Held at the ns-3 default ON PURPOSE, even though P1 proposes lowering it for
# the dataset. P0's job is to reproduce the sigma table, and that table was
# measured at the default floor. Changing it here would silently invalidate the
# +-0.02 dB reproduction gate.
minRssiDbm      = -82          # dBm, ThresholdPreambleDetectionModel default


# --- Transmit power --------------------------------------------------------
# 10 dBm for gate 1 (RSSI vs theory) and gate 2 (MAC retry). Gate 3 (residual
# sigma per Nakagami tier) needs 40 dBm passed on the command line, because at
# 10 dBm the -82 dBm floor censors the whole m=3 tier and the gate cannot be
# evaluated. sigma in dB is invariant to transmit power (Nakagami multiplies by
# a unit-mean gamma), so raising it moves the floor out of the measurement
# window without touching the quantity being measured.
txPowerDbm      = 10           # dBm


# --- Two-node flight geometry ----------------------------------------------
# One node still, one flying straight out: one run sweeps the whole RSSI range,
# so it can be checked against path loss computed by hand.
p0Fading        = true         # gate 1 needs --p0Fading=false
p0Altitude      = 100          # m, both nodes. Horizontal flight only, so
                               # distance is a clean function of time.
p0StartDist     = 10           # m
p0Speed         = 10           # m/s. Slower than the nominal 15-30 m/s on
                               # purpose: it packs more RSSI samples per metre
                               # of distance. Speed does not enter the channel
                               # model (no Doppler), so this costs nothing.
simTime         = 60           # s -> 610 m of flight. Gate 3 uses 80 s.

# 10 ms gives ~10 samples per metre at 10 m/s. Known consequence, documented in
# reports/P0-instrumentation.md: past the link death this saturates the MAC
# queue, so the run-total retry_rate is an artefact (0.9478 at 10 ms vs 0.9475
# at 50 ms - pacing does not fix it). Only the per-distance-bin retry curve is
# usable. Left at 10 ms because gate 1 and gate 3 want sample density and both
# read RSSI, not retry.
p0ProbeIntervalMs = 10         # ms
probeBytes      = 512          # B. Overrides the harness value: this is the
                               # size the P0 numbers were measured with.
