# ===========================================================================
# FANET Tier 2 — frozen simulation config for LinkScore weight fitting
# ===========================================================================
#
# This file is the single source of truth for the simulation setup. It is read
# by scratch/link-dataset-fanet.cc and is meant to be read by the Python
# analysis scripts too, so that the numbers in the paper's Simulation Setup
# table cannot drift away from the numbers the simulator actually used.
#
# FORMAT     key = value        '#' begins a comment, blank lines ignored.
# PRECEDENCE built-in default  <  this file  <  command line flag
#            So `--txPowerDbm=20` on the command line beats this file, which is
#            what you want for sweeps. The binary prints every value it ended
#            up using, and warns about keys here that it does not recognise —
#            a typo in this file is loud, not silent.
#
# WHEN YOU CHANGE SOMETHING HERE, the run is no longer comparable with runs
# made before the change. Re-run the whole seed batch, do not mix.
# ---------------------------------------------------------------------------


# --- Scenario --------------------------------------------------------------
numNodes        = 30
simTime         = 300          # s. Long enough for the topology to reorganise
                               # several times at 15-30 m/s.

# Field is a box: areaX x areaY horizontally, altMin..altMax vertically.
areaX           = 2000         # m
areaY           = 2000         # m
altMin          = 100          # m
altMax          = 600          # m


# --- Mobility: Gauss-Markov (3D) -------------------------------------------
# ns-3's own documentation example for this model contains two bugs that every
# FANET tutorial has copied verbatim. Both are fixed below; see the comments.
# Check src/mobility/model/gauss-markov-mobility-model.h lines 48-62 yourself.

gmAlpha         = 0.85         # memory. 1.0 = deterministic (the ns-3 attribute
                               # DEFAULT, which is useless), 0.0 = memoryless.
gmTimeStep      = 0.5          # s

gmVelMin        = 15           # m/s   Fixed-wing / fast multirotor UAV cruise.
gmVelMax        = 30           # m/s

# ADDED in P1 (a key that was missing, not a changed value: runs made before
# this line are still comparable, because the ns-3 attribute default for
# MeanDirection is already Uniform[0, 2*pi] and this states it explicitly).
# The mean heading each node's Gauss-Markov process reverts towards. Uniform
# over the full circle = no preferred direction of travel, which is what an
# unstructured swarm should be. Note DoWalk mirrors this on a boundary hit
# (m_meanDirection = M_PI - m_meanDirection), so headings do not stay uniform
# conditional on being near a wall.
gmDirMin        = 0.0          # rad
gmDirMax        = 6.283185307  # rad  (2*pi)

# BUG 1 in the ns-3 doc example: MeanPitch is given as Min=0.05|Max=0.05.
# Min == Max means mean pitch is always POSITIVE, so every UAV climbs forever,
# the whole swarm pins against the altitude ceiling within a minute, and the
# network silently degenerates to 2D. Must straddle zero.
gmPitchMin      = -0.05        # rad
gmPitchMax      = 0.05         # rad

# BUG 2 in the same example: NormalVelocity variance is 0.0, so speed never
# fluctuates at all and the Gauss-Markov process has no velocity noise term.
gmNormVelVar    = 2.0
gmNormVelBound  = 4.0
gmNormDirVar    = 0.2
gmNormDirBound  = 0.4
gmNormPitchVar  = 0.02
gmNormPitchBound = 0.04


# --- PHY / propagation -----------------------------------------------------
# 802.11a, ConstantRateWifiManager. Rate adaptation is never enabled: it
# compensates for degrading links and would erase the signal being measured.
#
# ADDED KEYS (P1), values identical to the scenario defaults they replace, so
# no run changes behaviour. They were previously stated in this comment only,
# which meant two rows of the paper's Simulation Setup table were not covered by
# config_sha256 in run_manifest.json. A parameter documented in prose is a
# parameter that can drift away from the binary without leaving a trace.
channelNumber   = 36           # 5 GHz channel 36 = 5180 MHz
dataMode        = OfdmRate6Mbps  # also used as ControlMode

# ADDED P2 (2026-07-27) — SYSTEM-WIDE DECISION, applies to Tier 2 AND Tier 3,
# goes in the paper's Simulation Setup table (CLAUDE.md param table has the
# full rationale). dot11ShortRetryLimit: the MAXIMUM NUMBER OF TRANSMISSION
# ATTEMPTS per frame (checked in ns-3.45 source: dropped when retry count
# reaches this; min 1). The pre-3.44 knobs MaxSsrc/MaxSlrc are OBSOLETE and
# replaced by this single WifiMac::FrameRetryLimit attribute.
#   (i)  Retries of one frame are correlated trials: L=7 counts a burst of 7
#        correlated failures as 7 iid Bernoulli trials — the binomial GLM
#        overstates its information ~sqrt(5); L=2 bounds it at ~sqrt(2).
#   (ii) At FANET speeds persistent retry is counterproductive: the topology
#        changes before the burst ends.
# Measured at L=7 (P2 smoke run 1): ARQ amplification x5.37, probe airtime
# 228.8% of simTime, channel saturated by the instrument itself.
frameRetryLimit = 2

# CORRECTED VALUE. The spec this file was built from called for 10 dBm "for
# ~500 m coverage at exponent 2.2", which does not hold: with ns-3's LogDistance
# reference loss of 46.6777 dB at 1 m, a -94 dBm noise floor and ~5 dB SNR for
# BPSK 1/2, 10 dBm reaches about 239 m.
#
# The link-budget arithmetic then predicted degree 6.45 at 18 dBm. That was ALSO
# wrong — it assumes an unbounded medium, while most UAVs sit near the edge of a
# 2000 m box and have a large part of their coverage sphere outside the field.
# These are MEASURED values from the harness (the "mean 1-hop degree" line):
#
#     txPower   degree   note
#      18 dBm    2.95    predicted 6.45; boundary effects halve it
#      20 dBm    5.28    mean over 9 seeds, sd ~0.5    <-- default
#      22 dBm    8.13
#      24 dBm   11.37
#      26 dBm      --    ns-3 phy-entity assert, run aborts
#
#   holding 18 dBm and shrinking the field instead:
#     1400x1400    6.19
#     1000x1000   10.74
#
# Trust the printed number, not a formula. Above degree ~11 runs start hitting
# NS_ASSERT(!m_currentEvent) at src/wifi/model/phy-entity.cc:490 — an ns-3 PHY
# state-machine defect, not a scenario error — and abort. Even at degree ~5,
# roughly 1 run in 10 aborts, so the seed campaign must check exit codes and
# substitute a fresh seed rather than assuming 25 runs produce 25 files.
#
# ---------------------------------------------------------------------------
# P1 UPDATE (2026-07-26). Two of the statements above no longer hold in this
# tree. Neither is deleted, because the measurements above were real; they were
# simply made elsewhere.
#
# (a) The abort warning is obsolete. That assert is patched in this tree (see
#     CLAUDE.md, "The local ns-3 patch"). Measured after the patch: a 30-node
#     300 s run at degree 22.33 completes cleanly, and three topology runs hit
#     the assert zero times. Degree above 11 is no longer forbidden ground.
#
# (b) The degree table above could NOT be reproduced. scratch/linkscore/
#     topology-probe.cc measures, at this file's own 20 dBm and at the ns-3
#     default detection floor:
#
#         link definition                      degree
#         beacon ratio >= 0.5 over 5 s          1.06
#         >= 1 beacon in 5 s (loose, ~TTL)      3.99
#         reference value in the table above    5.28
#
#     No link definition tried reproduces 5.28. The scenario that produced it,
#     link-dataset-fanet.cc, is not in this tree, so the measurement conditions
#     are unknown and the old number is NOT declared wrong — it is unverifiable
#     here. The new measurement carries an internal check the old one does not:
#     degree computed purely geometrically from the recorded positions, with no
#     beacon involved, gives 0.92 at R=300 m against 1.06 measured, and ~6.0 at
#     R=625 m against 6.14 measured. Two independent routes agreeing to ~15%.
#
# CHANGED VALUE, not an added key: 20 -> 19 dBm. Runs made before this line are
# not comparable. Measured at 19 dBm with minRssiDbm = -101 below:
#     degree 6.14 (strict) | isolated 0.6% of node-time | R(PDR 0.5) = 625 m
# See reports/P1-config.md.
txPowerDbm      = 19           # dBm

exponent        = 2.2          # Air-to-air is near line-of-sight; 2.0 is free
                               # space, 2.2 adds a little margin.

# CHANGED BEHAVIOUR (P1). Previously absent, so every run used ns-3's default of
# -82 dBm. ThresholdPreambleDetectionModel drops a frame whose RSSI is below
# this value whatever its SNR, so -82 is a hard floor sitting 7 dB ABOVE the
# noise-limited sensitivity (-94 dBm noise, ~5 dB SNR for BPSK 1/2). At -101 the
# binding constraint becomes the model's other attribute, Threshold = 4 dB SNR.
#
# What this buys is NOT extra boundary-region data. Link budget is
# txPower - floor, and degree pins that budget: 12 dBm at -101 and 20 dBm at -82
# are both 102 dB and measure the identical range. The reasons are:
#
#   1. It uncensors the RSSI FEATURE. Below the floor no sample exists at all,
#      so at boundary distances only the upper half of the fading swing is ever
#      observed. That truncates the RSSI distribution and drags the p20
#      percentile of P3 towards the censoring edge.
#   2. The link edge becomes a function of interference. With an SNR threshold,
#      a busier channel shortens the range, which is the physical behaviour. An
#      absolute -82 dBm constant does not move at all under load. In P0's 2-node
#      runs the two are indistinguishable; in P2, with 30 nodes probing, they
#      are not.
minRssiDbm      = -101         # dBm, ThresholdPreambleDetectionModel::MinimumRssi

# Nakagami shape. m > 1 is milder than Rayleigh, m < 1 is worse. High m here
# because A2A links are LoS-dominated, decreasing with distance as the ground
# reflection and airframe shadowing contribute more.
#
# NOTE the distance thresholds. ns-3's defaults are 80 m and 200 m with
# m1 = m2 = 0.75 — worse than Rayleigh, at absolute distances that were chosen
# for a ground vehicular scenario and do NOT scale with your radio range. Left
# at the defaults they dominate everything past 80 m and make link quality
# insensitive to transmit power. Scale them to the coverage radius instead.
nakagamiM0      = 8.0          # d < nakagamiD1
nakagamiM1      = 5.0          # nakagamiD1 <= d < nakagamiD2
nakagamiM2      = 3.0          # d >= nakagamiD2
nakagamiD1      = 100          # m
nakagamiD2      = 300          # m


# --- Measurement harness ---------------------------------------------------
# REWRITTEN in P2 (2026-07-26). The old text here said "there is no routing
# protocol and no application traffic" — that design was retired (PLAN.md P2,
# CLAUDE.md "Three simulation tiers"). Tier 2 now runs FOUR transmission types
# on one shared radio per node:
#
#   OLSR    stock, HELLO fixed at 2 s. Load generator and router for the CBR
#           flows ONLY — not modified, not measured, not reported. It routes
#           by hop count, so it is blind to LinkScore (no endogeneity).
#   CBR     multi-hop UDP flows routed by OLSR. Makes the contention that
#           retry is measured under resemble Tier 3. Its unicast data frames
#           are label trials on whichever link they cross (columns *_cbr).
#   BEACON  L2 broadcast, sole source of the RSSI feature: uniform sampling
#           density on every link, uncorrelated with routing and probing.
#           Unacknowledged, so no retry and no label.
#   PROBE   L2 unicast (NetDevice::Send, no IP) to each neighbour still heard
#           by beacon. Fills in the links routing never uses (columns *_probe).
#
# ARP is preloaded statically. An ARP reply is a ~64 B unicast that enters
# MacTxDataFailed (which reports only an address, so it cannot be filtered by
# size) without a matching entry in the size-filtered denominator — it would
# inflate fails/attempts one-sidedly. Declared in the paper.

# CHANGED VALUE (P2): 1.0 -> 0.1 s. At 1 Hz a 4 s feature window holds 4 RSSI
# samples and the OLS slope drowns in noise (CLAUDE.md rule 8 sizes the ring
# buffer at ~20 samples). 10 Hz gives ~40 samples/window and is the rate the
# P1 degree measurement (6.14) used, so degree stays directly comparable.
# Airtime cost ~3-4%% of one contention domain. No Tier-2 run predates this
# change, so nothing becomes incomparable.
beaconInterval  = 0.1          # s, per node, per-send jittered +-5%
beaconBytes     = 32
# CHANGED SEMANTICS (P2): was "per node"; now the interval PER NEIGHBOUR, with
# independent phase per (node, neighbour) pair. A neighbour is probed while
# still heard by beacon within neighborTtl — NOT while unicast still succeeds
# (that would cut off exactly the very-bad tail that anchors the bottom of
# the sigmoid).
#
# CHANGED VALUE (P2 run 3): 0.5 -> 1.0 s. Run 2 measured total airtime 105.6%
# of simTime network-wide against the 50-70% target, with probe the dominant
# term (96.1%). Halving the send rate does NOT halve probe airtime: run 2
# measured a +28% admission feedback (clearer channel -> more beacons decoded
# -> TTL admits more neighbours, 9.0 -> 11.5 of a ~14 loose-degree ceiling).
# Projection including that feedback: total ~60-68% network-wide (run 3
# measured 60.9%). Cost: probe attempts per label window ~4 sends x ~1.8 ARQ
# amplification ~ 7. The analysis keeps ALL rows whatever their trials count
# (CLAUDE.md, settled 2026-07-27): the binomial GLM weights by n, so thin
# rows are valid low-weight observations.
probeInterval   = 1.0          # s, per neighbour, phase-jittered
# CHANGED VALUE (P2): 64 -> 540. Rule 12: probe and data frames must have the
# same airtime. CBR payload 512 B gains UDP 8 + IPv4 20 = 28 B that the L2
# probe does not; 512 + 28 = 540 makes both 548 B MSDUs after LLC/SNAP (+8)
# and identical PPDUs on air. Do not trust this arithmetic: the harness logs
# PPDU sizes from MonitorSnifferTx for both classes and asserts they match.
probeBytes      = 540
# Probe anyone heard this recently. This is the single most consequential knob
# in the harness and it is a BIAS knob, not a correctness knob. Measured at
# txPower=20, seed 1 — note that degree barely moves while loss moves a lot,
# which rules out "it is just density":
#
#     neighborTtl   degree   MAC loss   rows
#        0.5 s       5.03      45.8%    11882
#        1.0 s       5.16      53.5%    13503
#        2.0 s       5.30      57.4%    14425      <-- default
#        4.0 s       5.41      61.0%    15425
#        6.0 s       5.44      61.9%    15722
#
# Long TTL admits links heard once on a fading peak and otherwise dead, so much
# of the measured loss is manufactured by the admission rule rather than by the
# channel. Short TTL re-introduces the censoring this harness exists to remove,
# and worse, it censors in a way that correlates with the label.
#
# 2.0 s is twice beaconInterval, i.e. "responded to at least one of the last two
# beacons" — the same logic as OLSR's neighbour hold time being a multiple of
# the HELLO interval. Do not tune this to make the loss number look good; record
# beacon_ratio and let the analysis weight marginal links instead.
neighborTtl     = 2.0          # s


# --- Background load (P2) --------------------------------------------------
# CBR over UDP, routed by stock OLSR. Starting point, NOT calibrated: rule 13
# wants the operating load chosen where corr(retry_rate, rssi_mean) is most
# negative, and the smoke test prints airtime by source (beacon/probe/CBR/
# OLSR) precisely so this block can be revisited with numbers. Flow endpoints
# are drawn per seed from the run's RNG stream, constant for the whole run.
cbrFlows        = 6            # simultaneous unicast flows
cbrBytes        = 512          # B UDP payload; probeBytes above is slaved to
                               # this (+28) so both classes share one airtime
cbrPps          = 8            # packets/s per flow (~33 kbps each)

# Bounds queue backlog by packet LIFETIME, which is what actually works: P0
# measured that pacing alone does not (10 ms probe interval -> retry 0.9478,
# 50 ms -> 0.9475, because a dead link keeps queueing whatever the pace).
# One radio per node => one shared queue, so this applies to OLSR and CBR
# packets too, deliberately: a >100 ms stale frame is better dropped than
# transmitted late, and a queue-dropped packet never becomes a MAC attempt so
# it stays out of both sides of the label (rule 3). Queue drops are COUNTED
# (expired vs overflow) in the run summary, never labelled. The harness also
# records the queue-delay distribution: if p99 approaches this cap in normal
# operation, MaxDelay is actively shaping traffic and has become a confound.
maxQueueDelayMs = 100          # ms, WifiMacQueue::MaxDelay, all nodes


# --- Feature / label windows -----------------------------------------------
# Features come from [t-featureWin, t). The label comes from [t, t+labelWin).
# Never the same window: MAC retry and PDR are nearly the same quantity, so
# contemporaneous fitting is tautological.
#
# featureWin is 4.0 and not 2.0 because of slope detectability. The OLS
# standard error of the slope falls as win^1.5 (longer lever arm and more
# samples), while the slope itself is unchanged:
#
#     distance   win=2 s          win=4 s
#      200 m     t = 1.1          t = 3.2
#      400 m     t = 0.6          t = 1.6
#
# At 2 s the slope coefficient is indistinguishable from noise and you lose a
# third of the LinkScore formula. Note that slope stays easier to measure on
# near links than far ones at any window length — that is a Limitations item,
# not something a parameter fixes.
featureWin      = 4.0          # s
# CHANGED VALUE (P2): 2.0 -> 4.0. CLAUDE.md and the P1 table in PLAN.md both
# fix tau = 4 s; the 2.0 here was inherited from the out-of-tree scenario that
# produced the unreproducible degree table above. CLAUDE.md is the invariant.
# At probeInterval 0.5 s/neighbour this gives 8 probe trials per row.
labelWin        = 4.0          # s

# Rows are only emitted for anchors t >= warmupTime: Gauss-Markov needs to
# forget its uniform start, OLSR needs routes, and the first feature window
# needs to fill (CLAUDE.md: discard first 30 s).
warmupTime      = 30           # s

minRssiSamples  = 3            # drop rows with fewer RSSI samples than this
minTrials       = 2            # drop rows with fewer future unicast trials.
                               # Deliberately low: rows carry (trials, fails)
                               # as binomial counts, so a 2-trial row is a valid
                               # low-weight observation. Raising it to 5 would
                               # silently delete the probe-only links.


# --- Acceptance gate -------------------------------------------------------
# Printed at the end of every run.
#
# An earlier version of this gate rejected any run above 20% MAC frame loss, on
# the reasoning that heavy loss means a collapsing network. The neighborTtl
# sweep above falsified that: loss moves from 46% to 62% while degree stays put,
# so aggregate loss is mostly reporting WHICH LINKS THE HARNESS CHOSE TO
# MEASURE, not how healthy the network is. A harness that deliberately probes
# marginal links must show high loss; that is the design working. gateLossMax is
# now set only to catch genuine collapse.
#
# What actually matters for a logistic fit is that the label is not saturated at
# both ends — rows with 0 < pdr < 1 are the ones carrying gradient information.
gateDegreeMin   = 4.0          # below this the network is barely connected
gateRetryMin    = 10.0         # % of rows with any retry; below this the retry
                               # feature has no variance and cannot carry a coeff
gateMidMin      = 10.0         # % of rows with pdr strictly between 0 and 1

# P2 run 3 (2026-07-27) showed the aggregate loss number is a probe-PLACEMENT-
# weighted average, not a channel-health indicator: 78.3% on a healthy channel
# (degree 4.97, queue empty, 60.9% occupancy) simply because 53.5% of probe
# trials sit beyond 600 m where q = 0.91-0.99 by waterfall physics — exactly
# the tail rule 12 requires probing. Saturation, by contrast, raises q in the
# NEAR bins too (run 1 -> 3, 0-200 m: 0.098 -> 0.055; 200-400 m: 0.370 ->
# 0.244). Hence TWO gates with two distinct roles:
#
# PRIMARY saturation gate: pooled per-attempt q over links CLOSER than
# 0.64 * rHalfM (= 400 m at the frozen 625 m). Near-q is what collapse moves
# and the deliberately-probed far tail cannot touch. NOT a constant distance:
# the inherited 75% threshold went wrong precisely because it was a constant
# carried from another radio config — tie the definition to the measured
# R(0.5) instead. Threshold 0.35 is calibrated from exactly TWO points
# (run 2 mildly saturated: 0.33; run 3 healthy: 0.216) — one seed each, so it
# is deliberately permissive; REVISIT after the first batch.
# THE GATE SYSTEM IS A CONJUNCTION, NOT A SET OF INDEPENDENT CHECKS. Measured
# on the three smoke runs: near-q alone does NOT separate mild saturation —
# run 2 (105.6% occupancy) scored 0.343, squeaking under 0.35 — it was the
# degree gate that caught run 2. Read near-q TOGETHER with degree; neither
# alone is the saturation detector. Recalibrate the 0.35 only after the
# 35-seed batch provides a per-seed distribution, not before.
rHalfM          = 625          # m, measured R(PDR 0.5) from P1 — near zone is
                               # 0.64 * this
gateNearQMax    = 0.35         # pooled q (probe+cbr) over links < 0.64*rHalfM

# BACKSTOP collapse gate, role changed in P2 run 3: this is a CHANNEL-COLLAPSE
# indicator, NOT a data-quality indicator — an uncensored harness at 19 dBm /
# -101 dBm measures a long dying tail and must show high aggregate loss (run 3
# healthy: 78.3%). Genuine saturation measured 92.9% (run 1). 85 sits between.
gateLossMax     = 85.0         # % failed attempts network-wide — collapse only
gatePinnedMax   = 90.0         # % of rows with pdr exactly 0 or exactly 1.
                               # Partly an artefact of small n per row: at the
                               # P2 values (labelWin 4 s / probeInterval 1.0 s
                               # -> ~4 sends x ~1.8 ARQ ~ 7 attempts) even a
                               # 0.9-quality off-path link comes out clean
                               # (7/7) about 48% of the time.


# --- Seed batches ----------------------------------------------------------
# Split by seed, never by row: rows from one run are correlated. These are
# recorded here for the analysis scripts to read; the binary ignores them and
# takes a single --seed per run.
# SETTLED P2 (2026-07-27): 40 seeds = 5 / 30 / 5. The old 15-seed training
# batch contradicted CLAUDE.md rule 6 (cluster-robust SE wants 30-50 clusters,
# and the cluster is the seed). Run 3 wall time ~3 min/seed -> 40 seeds ~ 2 h.
seedsCalibration = 1-5
seedsTrain       = 6-35
seedsTest        = 36-40
